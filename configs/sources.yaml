# Nexus Coder v0.3 - Training Data Sources Configuration
# =======================================================
# Curated sources for pre-training Nexus Coder v0.3.
# Target: ~500 GitHub repos + ~150 HuggingFace datasets + 5 new sources.
#
# Author: Hieu Louis (2026)
# Total estimated tokens (post-filtering): ~50B-200B
#
# References (the inspiration for many of these sources):
#   - litgpt's curated pretraining datasets
#   - LlamaFactory's example configs
#   - axolotl's dataset registry
#   - StarCoder2 paper data card
#   - The-Stack v2 dataset card

# =============================================================================
# GitHub — curated code repos (~500)
# =============================================================================
github:
  enabled: true
  cache_dir: "./data_cache/github"
  max_concurrent: 8
  max_files_per_repo: 1000
  max_file_size_kb: 100

  repos:
    # ---------- Python core & stdlib (5) ----------
    - {owner: "python", name: "cpython", languages: ["python"], max_files: 3000}
    - {owner: "pallets", name: "flask", languages: ["python"]}
