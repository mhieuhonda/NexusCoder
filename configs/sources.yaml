github:
  enabled: true
  cache_dir: "./data_cache/github"
  max_concurrent: 4
  max_files_per_repo: 1000
  max_file_size_kb: 100
  
  # Curated repos (60+ repos)
  repos:
    # Python core
    - {owner: "python", name: "cpython", languages: ["python"], max_files: 2000}
    - {owner: "pallets", name: "flask", languages: ["python"]}
    - {owner: "pallets", name: "django", languages: ["python"], max_files: 2000}
    - {owner: "psf", name: "requests", languages: ["python"]}
    
    # Data science
    - {owner: "numpy", name: "numpy", languages: ["python"], max_files: 2000}
    - {owner: "pandas-dev", name: "pandas", languages: ["python"], max_files: 2000}
    - {owner: "scipy", name: "scipy", languages: ["python"], max_files: 2000}
    - {owner: "matplotlib", name: "matplotlib", languages: ["python"], max_files: 2000}
    - {owner: "scikit-learn", name: "scikit-learn", languages: ["python"], max_files: 2000}
    
    # ML/DL
    - {owner: "pytorch", name: "pytorch", languages: ["python", "cpp"], max_files: 2000}
    - {owner: "tensorflow", name: "tensorflow", languages: ["python", "cpp"], max_files: 2000}
    - {owner: "huggingface", name: "transformers", languages: ["python"], max_files: 2000}
    - {owner: "huggingface", name: "datasets", languages: ["python"]}
    - {owner: "langchain-ai", name: "langchain", languages: ["python"], max_files: 2000}
    
    # Web frameworks
    - {owner: "tiangolo", name: "fastapi", languages: ["python"], max_files: 2000}
    - {owner: "encode", name: "starlette", languages: ["python"]}
    - {owner: "encode", name: "uvicorn", languages: ["python"]}
    
    # Tools
    - {owner: "pytest-dev", name: "pytest", languages: ["python"]}
    - {owner: "psf", name: "black", languages: ["python"]}
    - {owner: "pydantic", name: "pydantic", languages: ["python"]}
    
    # JavaScript/TypeScript
    - {owner: "facebook", name: "react", languages: ["javascript", "typescript"], max_files: 2000}
    - {owner: "vuejs", name: "vue", languages: ["javascript", "typescript"], max_files: 2000}
    - {owner: "vercel", name: "next.js", languages: ["javascript", "typescript"], max_files: 2000}
    - {owner: "microsoft", name: "TypeScript", languages: ["typescript"], max_files: 2000}
    - {owner: "nodejs", name: "node", languages: ["javascript", "c++"], max_files: 2000}
    
    # Go
    - {owner: "golang", name: "go", languages: ["go"], max_files: 2000}
    - {owner: "gin-gonic", name: "gin", languages: ["go"]}
    - {owner: "kubernetes", name: "kubernetes", languages: ["go"], max_files: 2000}
    - {owner: "prometheus", name: "prometheus", languages: ["go"], max_files: 2000}
    - {owner: "hashicorp", name: "terraform", languages: ["go"], max_files: 2000}
    
    # Rust
    - {owner: "rust-lang", name: "rust", languages: ["rust"], max_files: 2000}
    - {owner: "tokio-rs", name: "tokio", languages: ["rust"], max_files: 2000}
    - {owner: "serde-rs", name: "serde", languages: ["rust"]}
    - {owner: "BurntSushi", name: "ripgrep", languages: ["rust"]}

huggingface:
  enabled: true
  cache_dir: "./data_cache/hf"
  
  # Curated datasets (20+)
  datasets:
    # Code datasets
    - {name: "codeparrot/codeparrot-clean", max_samples: 50000, language: "python"}
    - {name: "codeparrot/github-code", max_samples: 30000, language: "multiple"}
    - {name: "bigcode/the-stack-dedup", max_samples: 20000, language: "multiple"}
    - {name: "nampdn-ai/tiny-codes", max_samples: 30000, language: "multiple"}
    - {name: "HuggingFaceH4/CodeAlpaca_20K", max_samples: 20000, language: "python"}
    
    # Vietnamese + English text
    - {name: "wikimedia/wikipedia", subset: "20231101.vi", max_samples: 20000}
    - {name: "wikimedia/wikipedia", subset: "20231101.en", max_samples: 20000}
    - {name: "oscar-corpus/OSCAR-2301", subset: "vi", max_samples: 10000}
    
    # Conversational
    - {name: "HuggingFaceH4/ultrachat_200k", max_samples: 20000}
    - {name: "Open-Orca/OpenOrca", max_samples: 15000}
    - {name: "teknium/OpenHermes-2.5", max_samples: 20000}
    - {name: "databricks/databricks-dolly-15k", max_samples: 15000}
    
    # Math
    - {name: "meta-math/MetaMathQA", max_samples: 20000}
    - {name: "gsm8k", max_samples: 8000}
    
    # Vietnamese specific
    - {name: "vietgpt/news_corpus", max_samples: 10000}

