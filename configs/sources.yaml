# =============================================================================
# v0.3 NEW SOURCES
# =============================================================================

# The-Stack v2 — BigCode's massive code dataset
the_stack:
  enabled: true
  cache_dir: "./data_cache/the_stack"
  version: "v2"
  # Top languages by sample count (rest skipped to keep size manageable)
  languages:
    - "python"
    - "javascript"
    - "typescript"
    - "java"
    - "go"
    - "rust"
    - "c"
    - "cpp"
    - "csharp"
    - "ruby"
    - "php"
    - "swift"
    - "kotlin"
    - "scala"
    - "shell"
    - "sql"
  max_samples_per_language: 5000
  min_stars: 0                   # include all repos regardless of stars
  license_filter: ["mit", "apache-2.0", "bsd-3-clause", "bsd-2-clause", "mpl-2.0", "unlicense"]

# StarCoder2 training data (github-code + commits + notebooks)
starcoder2_data:
  enabled: true
  cache_dir: "./data_cache/starcoder2"
  components:
    - "github_code"        # code files
    - "github_commits"     # commit diffs (good for editing tasks)
    - "github_jupyter"     # notebook cells (markdown + code)
  max_samples_per_component: 20000
  languages:
    - "python"
    - "javascript"
    - "typescript"
    - "java"
    - "go"
    - "rust"
    - "c"
    - "cpp"

# Python-Alpaca — high-quality Python instruction data
python_alpaca:
  enabled: true
  cache_dir: "./data_cache/python_alpaca"
  sources:
    - {name: "sahil2801/codealpaca", max_samples: 20000}
    - {name: "HuggingFaceH4/CodeAlpaca_20K", max_samples: 20000}
    - {name: "nickroany/Evol-Instruct-Code", max_samples: 15000}
    - {name: "TheBloke/CodeAlpaca-13B", max_samples: 5000}
    - {name: "codeparrot/codeparrot-clean", max_samples: 50000}
    - {name: "nampdn-ai/tiny-codes", max_samples: 50000}

# Kaggle — competition kernels & datasets metadata
kaggle:
  enabled: false                  # disabled by default — requires API key
  cache_dir: "./data_cache/kaggle"
  api_key_env: "KAGGLE_API_KEY"
  competitions:
    - "titanic"
    - "house-prices-advanced-regression-techniques"
    - "digit-recognizer"
    - " Spaceship-Titanic"
    - "favorita-grocery-sales-forecasting"
  max_kernels_per_competition: 100

# =============================================================================
# Processing pipeline settings
# =============================================================================
processing:
  cleaner:
    remove_html: true
    remove_urls: false
    normalize_whitespace: true
    min_length: 50
    max_length: 100000

  quality_filter:
    min_length: 50
    max_length: 100000
    min_words: 10
    min_unique_ratio: 0.3
    max_repetition: 0.5

  deduplicator:
    ngram_size: 5
    num_perm: 128
    similarity_threshold: 0.8

  # v0.3 NEW processors
  language_id:
    enabled: true
    # Identify language of each text sample (drops mislabelled)
    min_confidence: 0.85
    allowed_languages: ["vi", "en", "code"]

  code_quality:
    enabled: true
    # Score code samples (1-10), drop samples below threshold
    min_score: 6.0
    factors:
      has_docstring: 1.5
      has_type_hints: 1.0
      no_print: 0.5
      no_eval: 1.0
      no_bare_except: 1.0
      reasonable_length: 1.0       # 10-500 lines
      has_test: 2.0                # bonus for adjacent test file

  curriculum:
    stages:
      - {name: "easy",    min_length: 50,    max_length: 500,    min_quality: 0.7}
      - {name: "medium",  min_length: 500,   max_length: 5000,   min_quality: 0.6}
      - {name: "hard",    min_length: 5000,  max_length: 30000,  min_quality: 0.7}
      - {name: "expert",  min_length: 30000, max_length: 100000, min_quality: 0.8}

# =============================================================================
# Token budget estimation (v0.3 NEW)
# =============================================================================
token_budget:
  total_target_tokens: 500_000_000_000   # 500B tokens (for 30B model pretrain)
  distribution:
    code: 0.40                            # 40% code (The-Stack, StarCoder2-data, GitHub)
    text: 0.30                            # 30% natural text (Wikipedia, C4, OSCAR)
    instruction: 0.15                     # 15% instruction-tuning (Alpaca, ShareGPT)
    math: 0.10                            # 10% math (GSM8K, MATH, MetaMathQA)
    vietnamese: 0.05                      # 5% Vietnamese-specific
