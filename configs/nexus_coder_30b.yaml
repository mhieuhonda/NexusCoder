# Nexus Coder Configuration - 30B/3B v0.3 NEW
# Pretrain on 64-128 H100 80GB GPUs.
# Recommended for serious pretraining at frontier scale.
# Author: Hieu Louis (2026)

model:
  name: "Nexus Coder 30B"
  agent_name: "Nexus"
  author: "Hieu Louis"
  version: "0.3.0-30b"
  github: "mhieuhonda"
  year: "2026"

architecture:
  vocab_size: 64000
  hidden_size: 4096
  num_hidden_layers: 24
  num_attention_heads: 32
  num_kv_heads: 8
  head_dim: 128
  intermediate_size: 11264
  hidden_act: "silu"
  norm_type: "rmsnorm"

moe:
  num_experts: 48
  num_active_experts: 4
  router_aux_loss_coef: 0.001
  router_jitter_noise: 0.0

context:
  max_position_embeddings: 65536
  rotary_emb_base: 10000.0
  rope_scaling_type: "dynamic"        # NTK-aware scaling for 2× context
  rope_scaling_factor: 2.0

attention:
  use_flash_attention: true
  use_flash_attention_2: true          # mandatory at this scale
  use_alibi: false
  use_sliding_window: true
  sliding_window_size: 8192
  use_qk_norm: true
  qk_norm_eps: 1.0e-6
  mlp_parallel: true

compute:
  use_kv_cache: true
  kv_cache_quantization: "int8"
  gradient_checkpointing: true
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  expert_parallel_size: 4
  sequence_parallel: false

params:
  total: "~30B"
  active: "~3B"
  expert_utilization: "8.3%"
  estimated_disk_mb_fp16: 60000
  estimated_disk_mb_int8: 30000
  estimated_disk_mb_int4: 15000
  kv_cache_mb_per_token_fp16: 0.019
  kv_cache_mb_per_token_int8: 0.0095

training:
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 10000
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  logging_steps: 10
  save_steps: 1000
  max_grad_norm: 1.0
  seed: 42
  use_amp: true
  use_deepspeed: true
  deepspeed_config: "configs/ds_config_zero3.json"
  total_tokens_target: 500_000_000_000   # 500B tokens

inference:
  max_new_tokens: 1000
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  do_sample: true

personality:
  type: "humorous"
  language: "bilingual"

capabilities:
  skills_count: 60
  tools_count: 80

environment:
  python_version: "3.12.13"
  pytorch_version: ">=2.0"
  cuda_required: true
  min_gpu_memory_gb: 80
  recommended_gpus: "64-128 H100 80GB"
  estimated_training_time: "~30 days on 64 H100s"
