[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-coder"
version = "0.2.0"
description = "Nexus Coder v0.2 - AI Agent với MoE 10B/1.5B, 15 skills, 18+ tools, do Hieu Louis tạo ra"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Hieu Louis", email = "mhieuhonda@users.noreply.github.com"}
]
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "datasets>=2.14.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]
keywords = ["ai", "llm", "moe", "mixture-of-experts", "transformer", "nexus", "agent", "skills", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "flake8", "ruff"]
gpu = ["flash-attn>=2.0.0", "bitsandbytes>=0.41.0"]
data = ["datasets>=2.14.0", "datasketch>=1.6.0"]
tools = ["ruff>=0.1.0", "black>=23.0.0", "isort>=5.12.0"]
crypto = ["cryptography>=41.0.0"]
all = [
    "flash-attn>=2.0.0",
    "bitsandbytes>=0.41.0",
    "datasets>=2.14.0",
    "datasketch>=1.6.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "cryptography>=41.0.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/mhieuhonda/NexusCoder"
Repository = "https://github.com/mhieuhonda/NexusCoder"
Issues = "https://github.com/mhieuhonda/NexusCoder/issues"
Changelog = "https://github.com/mhieuhonda/NexusCoder/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["nexus*"]
